<html>

<head>
    <title> Date </title>
    <script>
        function displayDate() {
            var d = new Date();
            // for displaying Time without date
            // var x = d.toLocaleTimeString();

            // to display Date only without time
             var x = d.toLocaleDateString();
            document.getElementById("dateinfo").innerHTML = x;
        }



    </script>
</head>

<body onload="displayDate()">
    Current Date <br/>
    <p id="dateinfo"> </p>

</body>

</html>
