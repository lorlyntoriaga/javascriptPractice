<html>
  <head>
    <title>DOM: HTML </title>
    <script>
      function handleHTML(){
        document.getElementById("para1").align = "center";
        document.getElementById("img1").src = "racoon.jpg";
      }
    </script>
  </head>

  <body onload="handleHTML()">
    <p id="para1"> Hello World!</p>
    <image id="img1" src="otter.jpg"/>

  </body>
</html>
