<html>

<head>
    <title> Delete / Replicate </title>
    <script>
        var a = new Array(2, 3.1, "Hello");
        document.write(a + "<br/>")
        delete a[0];
        document.write(a + "<br/>")
        document.write(a[0] + "<br/>")

        // to replace the content inside the array
        a[1] = 6.6
        document.write(a[1] + "<br/>")

    
     
    </script>
</head>

<body>


</body>

</html>
