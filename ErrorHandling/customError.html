<html>
  <head>
    <title>Throw Custome Error</title>
    <script>
      function validateAge() {
        try {
          var age = document.getElementById("age").value;
          if (age == "") {
            throw "Age cannot be empty ";
          }
          if(age < 18){
            throw"To young to vote";
          }
          if(age > 18){
            throw"Allowed to vote"
          }
        } catch (obj) {
            document.getElementById("errorinfo").innerHTML = obj;
        } 
      }
    </script>
  </head>

  <body>
    Age: <input type="text" id="age" />
    <input type="button" onclick="validateAge()" />
    <p id="errorinfo"></p>
  </body>
</html>
