<html>
  <head>
    <title>Finally</title>
    <script>
      function validateAge() {
        try {
          var age = document.getElementById("age").value;
          if (age == "") {
            throw "Age cannot be empty ";
          }
          if(age < 18){
            throw"To young to vote";
          }
        } catch (obj) {
            document.getElementById("errorinfo").innerHTML = obj;
        } finally{
            // everything you write on this block will be executed when there is an exception or error 
            document.getElementById("finallyinfo").innerHTML = "Inside finally";

        }
      }
    </script>
  </head>

  <body>
    Age: <input type="text" id="age" />
    <input type="button" onclick="validateAge()" />
    <p id="errorinfo"></p>
    <p id="finallyinfo"> </p>
  </body>
</html>
