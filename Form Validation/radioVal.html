<html>

<head>
    <title>Radio Button Validation</title>
    <script>
        function validateRadio() {
            var valid = false;
            var x = document.myform.paymentmethod;

            for (var i = 0; i < x.length; i++) {
                if (x[i].checked) {
                    valid = true;
                    break;
                }
            }

            if (valid) {
                alert("You selected a payment method!");
            } else {
                alert("Please select a mode of payment");
                return false;
            }
        }
    </script>
</head>

<body>
    <h3>Select mode of payment: </h3>
    <form name="myform" action="radio.php" onsubmit="return validateRadio()">
        <input type="radio" name="paymentmethod" value="cod"> Cash on Delivery
        <input type="radio" name="paymentmethod" value="onlinebanking"> Online Banking
        <input type="radio" name="paymentmethod" value="creditcard"> Credit Card
        <input type="radio" name="paymentmethod" value="debitcard"> Debit Card


        <input type="submit" value="submit" />
    </form>
</body>

</html>
