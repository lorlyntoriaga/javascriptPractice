    <!-- Regular Expression
     Brackets
     [...] - Any one character in the brackets
     [^..] - Any one character not in the brackets
     [0-9] - Matches any decimal digit from 0 - 9
     [a-z] - Matches any character from lowercase a through lowercase z
     [A-Z] - Matches any character from uppercase A through uppercase Z

     Quantifiers
     x+ - It matches any string containing one or more x's
     x* - It matches any string containing zero or more x's
     x{N} - It matches any string containing a sequence of N x's
     x{3,5} - It matches any string containing a sequence of at least two x's
     x$ - It matches any string with x at the end of it
     ^x - It matches any string with x at the beginning of it 

     Meracharacters
     . - a single character
     \s - a whitespace character (space, tab, newline)
     \S - non whitespace character
     \d - a digit (0-9)
     \D - a non digit
     \w - a word character (a-z, A-Z, 0-9, _)
     -->
