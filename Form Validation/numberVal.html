<html>
  <head>
    <title>BOM Screen</title>
    <script>
      function validateNum() {
        var x = document.myform.num.value;

        if (isNaN(x) || x < 1 || x > 10) {
          alert("Please enter a valid number between 1-10");
          document.myform.num.focus();
          return false;
        } else{
            alert("That's a valid number!");
            return true;
        }
      }
    </script>
  </head>

  <body>
    <h3>Enter a number from 1 to 10:</h3>
    <form name="myform" action="number.php" onsubmit="return validateNum();">
      Number: <input type="text" name="num" />
      <input type="submit" value="submit" />
    </form>
  </body>
</html>
