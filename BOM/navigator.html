<html>

<head>
    <title> BOM Screen </title>
    <script>
        document.write("App Name " + navigator.appName + "</br>")
        document.write("App Name " + navigator.appCodeName + "</br>")
        document.write("App Name " + navigator.cookieEnabled + "</br>")
        document.write("App Name " + navigator.javaEnabled + "</br>")

        for (x in navigator){
            document.write(x + "</br>")
        }
    </script>
</head>

<body>


</body>

</html>
